# Giao diện tối, bảng màu dùng chung với các biểu đồ trong app.py
[theme]
base = "dark"
primaryColor = "#F43F5E"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#111B2E"
textColor = "#E5E7EB"
font = "sans serif"

[server]
headless = true
# Tắt bộ theo dõi tệp: nó quét mọi module đã nạp, chạm vào các module ảnh nạp
# chậm của transformers và in traceback "No module named 'torchvision'" vào log,
# dù app không dùng tới chúng. Khi cần sửa mã và muốn app tự nạp lại, đổi lại
# thành "auto".
fileWatcherType = "none"

[browser]
gatherUsageStats = false
